name: daily-market

on:
  schedule:
    - cron: "30 2 * * *"   # UTC 02:30 = 北京时间 10:30（门店全日菜单已上齐，站点按「通常上午出刊」）
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "人工放行：确认是真实缩减后，允许四类采集量下降（时段异常仍会中止）"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: daily-market
  cancel-in-progress: false

# 默认只读；写权限仅授予负责提交的 job，且只走 PR、不直推 main
permissions:
  contents: read

# 统一用北京时间：快照文件名/日期与读者看到的出刊日一致
env:
  TZ: Asia/Shanghai

jobs:
  market:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 推送 bot 分支
      pull-requests: write  # 开 PR 并合并
      issues: write         # 失败时自动开 issue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 行情部·快照采集
        run: python -m mcd_lab.snapshot
        env:
          MCD_MCP_TOKEN: ${{ secrets.MCD_MCP_TOKEN }}
          MCD_STORE_CODE: "1450713"
      - name: 行情部·差异引擎
        run: python -m mcd_lab.diff
      - name: 积分理财科·省钱榜
        run: python -m mcd_lab.points
      - name: 考古部·组合空间考古
        run: python -m mcd_lab.archaeology --limit 80
        env:
          MCD_MCP_TOKEN: ${{ secrets.MCD_MCP_TOKEN }}
          MCD_STORE_CODE: "1450713"
      - name: 数据校验（四类采集量；采集不全则跳过发布，不算失败）
        id: validate
        run: |
          set +e
          if [ "${{ inputs.allow_shrink }}" = "true" ]; then
            python -m mcd_lab.validate --allow-shrink > /tmp/validate.log 2>&1
          else
            python -m mcd_lab.validate > /tmp/validate.log 2>&1
          fi
          code=$?
          cat /tmp/validate.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "## 采集不全：本次跳过发布"
              echo
              echo '```'
              cat /tmp/validate.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit $code

      - name: 发布日报（分支 + PR + 合并，不直推 main）
        if: steps.validate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "mcd-research-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          DATE=$(TZ=Asia/Shanghai date +%F)
          BRANCH="bot/daily-market-${DATE}-${GITHUB_RUN_NUMBER}"
          git checkout -b "$BRANCH"
          git commit -m "data: 麦麦行情日报 ${DATE} [skip ci]"
          git push -u origin "$BRANCH"
          gh pr create \
            --base main --head "$BRANCH" \
            --title "data: 麦麦行情日报 ${DATE}" \
            --body "自动采集：快照 ${DATE}、行情日报、积分省钱榜、考古图鉴。合并后由 Pages 发布。"
          gh pr merge "$BRANCH" --merge --delete-branch
      - name: 失败告警（固定 issue，复用更新，不新开）
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="[auto-alert] daily-market 运行异常（固定追踪，请勿关闭）"
          NUM=$(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title | contains("[auto-alert]")) | .number' | head -n1)
          BODY="最近一次运行失败（本 issue 自动更新，勿手改）

          - 运行：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - 触发：${GITHUB_EVENT_NAME}
          - 提交：${GITHUB_SHA}
          - 时间（北京）：$(TZ=Asia/Shanghai date '+%F %T')

          失败摘要：
          ----------------------------------------
          $(tail -n 20 /tmp/validate.log 2>/dev/null || echo '（无 validate 日志；请查看运行链接中的失败步骤）')
          ----------------------------------------
          "
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body "$BODY"
            echo "已更新固定追踪 issue #$NUM"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
